<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大阪市区民センター 空き状況確認</title>
    <style>
        /* 全体フォント */
        html, body {
            font-family: 'Helvetica Neue', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #0e1117;
            color: #fafafa;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem 1rem 4rem 1rem;
        }

        /* ページヘッダー */
        .page-header {
            text-align: center;
            padding: 20px 0;
        }
        .page-header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            line-height: 1.3;
            color: #fafafa;
        }
        .page-header p {
            font-size: 13px;
            color: #a0aec0;
        }

        /* セクション見出し */
        h3 {
            font-size: 1.17em;
            margin-bottom: 12px;
            color: #fafafa;
        }

        /* フォームコントロール */
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        select, input[type="date"] {
            width: 100%;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #4a5568;
            background-color: #2d3748;
            color: #fafafa;
            font-size: 14px;
            box-sizing: border-box;
        }

        .flex-row {
            display: flex;
            gap: 16px;
        }
        .flex-half {
            flex: 1;
        }

        /* トグルボタン（もどき） */
        .toggle-container {
            display: flex;
            align-items: center;
            margin-top: 10px;
        }
        .toggle-container input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 8px;
        }
        .toggle-container label {
            font-size: 14px;
            font-weight: normal;
        }

        /* 検索ボタン */
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            letter-spacing: 0.3px;
            box-shadow: 0 4px 15px rgba(102,126,234,0.4);
            margin-top: 16px;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
        }

        /* 検索結果パネル */
        .result-panel {
            border-radius: 12px;
            padding: 16px;
            margin-top: 24px;
            background-color: #1a202c;
            overflow-x: auto;
        }
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .result-title {
            font-size: 15px;
            font-weight: 700;
        }
        .result-timestamp {
            font-size: 11px;
            color: #a0aec0;
        }

        /* テーブル */
        table.vc-table {
            width: 100%;
            border-collapse: collapse;
        }
        table.vc-table th {
            font-size: 12px;
            font-weight: 700;
            padding: 12px 10px;
            border-bottom: 2px solid #2d3748;
            text-align: center;
        }
        table.vc-table th.room-header {
            text-align: left;
            min-width: 120px;
            border-right: 2px solid #2d3748;
        }
        table.vc-table th.sat { color: #63b3ed; }
        table.vc-table th.sun, table.vc-table th.hol { color: #fc8181; }
        table.vc-table td {
            padding: 12px 8px;
            border-bottom: 1px solid #2d3748;
            vertical-align: middle;
            text-align: center;
            min-width: 120px;
        }
        table.vc-table td.room-cell {
            text-align: left;
            border-right: 2px solid #2d3748;
            padding-left: 10px;
            line-height: 1.4;
        }

        .facility-tag {
            display: inline-block;
            font-size: 10px;
            font-weight: 600;
            background: #2b6cb0;
            color: white;
            padding: 3px 8px;
            border-radius: 20px;
            margin-bottom: 6px;
            letter-spacing: 0.3px;
        }
        .room-label {
            font-size: 13px;
            font-weight: 700;
            color: #e2e8f0;
        }

        /* スロット */
        .slot-box {
            display: flex;
            flex-direction: row;
            justify-content: center;
            gap: 12px;
        }
        .slot-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .slot-time {
            font-size: 10px;
            color: #a0aec0;
            line-height: 1.2;
        }
        .slot-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }
        .slot-icon.ok { background: #276749; color: #c6f6d5; }
        .slot-icon.ng { background: #9b2335; color: #fed7d7; }
        .slot-icon.na { background: #2d3748; color: #a0aec0; }

        /* マルチセレクト風UI */
        .multiselect-container {
            border: 1px solid #4a5568;
            border-radius: 6px;
            background-color: #2d3748;
            padding: 8px;
            max-height: 200px;
            overflow-y: auto;
        }
        .multiselect-item {
            display: flex;
            align-items: center;
            margin-bottom: 4px;
            font-size: 14px;
        }

        /* リンクボタン */
        .link-section {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #2d3748;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .link-label { font-size: 12px; color: #a0aec0; font-weight: 600; }
        a.booking-btn {
            display: inline-block;
            padding: 6px 14px;
            background: transparent;
            border: 1.5px solid #667eea;
            color: #667eea;
            text-decoration: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }
        a.booking-btn:hover { background: #667eea; color: white; }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            font-size: 11px;
            color: #a0aec0;
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid #2d3748;
        }
        .legend-item { display: flex; align-items: center; gap: 4px; }
        
        #loading { display: none; margin-top: 20px; text-align: center; color: #667eea; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="page-header">
        <h1>大阪市区民センター<br>空き状況確認</h1>
        <p>指定した日付の会議室空き状況を検索します</p>
    </div>

    <h3>検索条件</h3>

    <div class="form-group">
        <label>🏢 施設を選択（複数可）</label>
        <div class="multiselect-container" id="facility-selects">
            <!-- JSで生成 -->
        </div>
    </div>

    <div class="flex-row">
        <div class="form-group flex-half">
            <label>📅 検索日</label>
            <input type="date" id="search-date">
        </div>
        <div class="form-group flex-half">
            <label>👥 最低利用人数</label>
            <input type="number" id="min-capacity" value="0" min="0" step="1">
            <small style="font-size:10px; color:#a0aec0;">0の場合は全て表示</small>
        </div>
    </div>

    <div class="toggle-container">
        <input type="checkbox" id="only-meeting" checked>
        <label for="only-meeting">📌 集会室・会議室のみ表示する</label>
    </div>

    <button class="btn-primary" id="search-btn">空き状況を検索</button>
    <div id="loading">データを取得・集計しています...</div>

    <div id="result-container" style="display:none;"></div>
</div>

<script>
const FACILITIES = {
    '01': '大阪市立北区民センター', '02': '大阪市立大淀コミュニティセンター', '03': '都島区民センター',
    '04': '福島区民センター', '05': '大阪市立此花区民ホール', '06': 'J:COM中央区民センター',
    '07': '大阪市立中央会館', '08': '西区民センター', '10': '大阪市立港近隣センター',
    '11': '大正会館', '12': '大阪市立天王寺区民センター', '13': '大阪市立浪速区民センター',
    '14': '西淀川区民ホール', '15': '大阪市立西淀川区民会館', '16': '大阪市立淀川区民センター',
    '17': '大阪市立東淀川区民会館', '18': '大阪市立東成区民センター', '19': '大阪市立生野区民センター',
    '20': '旭区民センター', '22': '大阪市立鶴見区民センター', '23': '大阪市立阿倍野区民センター',
    '24': '大阪市立住之江会館', '25': '住吉区民センター', '26': '大阪市立東住吉会館',
    '27': '大阪市立平野区民センター', '28': '大阪市立平野区民ホール', '29': '大阪市立西成区民センター',
    '30': '大阪市立城東区民センター', '31': '大正区民ホール', '32': '大阪市立東淀川区民ホール',
    '33': '大阪市立すみのえ舞昆ホール', '34': '大阪市立東住吉区民ホール', '35': '大阪市立港区民センター'
};

// 初期化
window.onload = () => {
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    document.getElementById('search-date').value = `${yyyy}-${mm}-${dd}`;

    const container = document.getElementById('facility-selects');
    for (const [code, name] of Object.entries(FACILITIES)) {
        const div = document.createElement('div');
        div.className = 'multiselect-item';
        const checked = (code === '18' || code === '23') ? 'checked' : '';
        div.innerHTML = `<input type="checkbox" id="fac-${code}" value="${code}" ${checked}> <label for="fac-${code}">${name}</label>`;
        container.appendChild(div);
    }
};

document.getElementById('search-btn').addEventListener('click', async () => {
    document.getElementById('loading').style.display = 'block';
    document.getElementById('result-container').style.display = 'none';
    
    // 値の取得
    const selectedCodes = Array.from(document.querySelectorAll('#facility-selects input:checked')).map(cb => cb.value);
    const targetDate = document.getElementById('search-date').value; // YYYY-MM-DD
    const minCap = parseInt(document.getElementById('min-capacity').value) || 0;
    const onlyMeeting = document.getElementById('only-meeting').checked;

    if (selectedCodes.length === 0) {
        alert("施設を1つ以上選択してください。");
        document.getElementById('loading').style.display = 'none';
        return;
    }

    try {
        // data.jsonをフェッチ
        const res = await fetch('data.json?' + new Date().getTime());
        if(!res.ok) throw new Error("data.json not found");
        const data = await res.json();
        
        let html = '';
        let foundAny = false;
        let dateHeader = targetDate;
        
        html += `<table class="vc-table">`;
        html += `<thead><tr><th class="room-header">施設 / 部屋名</th><th class="date-header" id="date-th"></th></tr></thead><tbody>`;

        // 施設順にソートして処理
        for (const code of selectedCodes) {
            const facData = data.facilities[code];
            if (!facData) continue;
            
            for (const room of facData.rooms) {
                if (onlyMeeting && !room.name.includes("集会") && !room.name.includes("会議")) continue;
                if (minCap > 0 && room.capacity < minCap) continue;
                
                const dateInfo = room.dates[targetDate];
                if (!dateInfo) continue;
                
                foundAny = true;
                dateHeader = dateInfo.header; // e.g. "2026/9/16(水)"
                
                html += `<tr>`;
                html += `<td class="room-cell"><span class="facility-tag">${facData.name}</span><br><span class="room-label">${room.name} <span style="font-size:11px; color:#a0aec0; font-weight:normal;">(定員: ${room.capacity}名)</span></span></td>`;
                
                const renderSlot = (name, slotData) => {
                    const status = slotData[0];
                    const timeStr = slotData[1];
                    let iconClass = 'na';
                    let iconTxt = '－';
                    if(status === '〇' || status === '○') { iconClass = 'ok'; iconTxt = '○'; }
                    else if(status === '×') { iconClass = 'ng'; iconTxt = '×'; }
                    
                    let timeHtml = (timeStr && timeStr !== '-') ? `<br><span style="font-size:8px; opacity:0.7; font-weight:normal;">${timeStr}</span>` : '';
                    return `<div class="slot-item"><span class="slot-time" style="line-height:1.2;">${name}${timeHtml}</span><div class="slot-icon ${iconClass}">${iconTxt}</div></div>`;
                };

                html += `<td><div class="slot-box">`;
                html += renderSlot("午前", dateInfo.am);
                html += renderSlot("午後", dateInfo.pm);
                html += renderSlot("夜間", dateInfo.night);
                html += `</div></td></tr>`;
            }
        }
        
        html += `</tbody></table>`;
        html += `<div class="legend">
            <div class="legend-item"><div class="slot-icon ok" style="margin:0;">○</div> 空きあり</div>
            <div class="legend-item"><div class="slot-icon ng" style="margin:0;">×</div> 予約済み・不可</div>
            <div class="legend-item"><div class="slot-icon na" style="margin:0;">－</div> 期間外など</div>
        </div>`;
        
        let linkHtml = `<div class="link-section"><span class="link-label">予約システムを開く：</span>`;
        for(const code of selectedCodes) {
            linkHtml += `<a href="https://www.shisetsu-osaka.jp/shisetsu-nw/akijokyo.html?scd=${code}" target="_blank" class="booking-btn">${FACILITIES[code]}</a>`;
        }
        linkHtml += `</div>`;

        if (!foundAny) {
            document.getElementById('result-container').innerHTML = `<div style="padding:20px; color:#fc8181;">条件に一致するデータが見つかりませんでした。人数条件を緩めるか、期間や施設を変えてお試しください。（※システムが未反映の日付の場合もあります）</div>`;
        } else {
            document.getElementById('result-container').innerHTML = `
                <div class="result-panel">
                    <div class="result-header">
                        <div class="result-title">検索結果</div>
                        <div class="result-timestamp">システム最終データ更新：${data.last_updated}</div>
                    </div>
                    ${html}
                    ${linkHtml}
                </div>
            `;
            // ヘッダーの色付け
            const dateTh = document.getElementById('date-th');
            dateTh.innerText = dateHeader;
            if(dateHeader.includes('土')) dateTh.className = "date-header sat";
            if(dateHeader.includes('日') || dateHeader.includes('祝')) dateTh.className = "date-header sun";
        }
        document.getElementById('result-container').style.display = 'block';

    } catch (e) {
        alert("データの読み込みに失敗しました。時間をおいて再試行してください。\n" + e.message);
    } finally {
        document.getElementById('loading').style.display = 'none';
    }
});
</script>
</body>
</html>
